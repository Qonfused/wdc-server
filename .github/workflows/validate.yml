name: Validate configuration

'on': [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  configuration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
      - name: Install the locked controller
        run: uv sync --locked
      - name: Check the input release lock
        run: uv run --locked python scripts/inputs.py check locks/input-release.json --project .
      - name: Restore collection download cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .work/collection-archives
          key: collections-${{ runner.os }}-${{ hashFiles('locks/collections.json') }}
      - name: Prepare verified Ansible collections
        run: uv run --locked ansible-playbook prepare.yml --tags collections
      - name: Check deployment and image playbooks
        run: |
          uv run --locked ansible-playbook bootstrap.yml --syntax-check
          uv run --locked ansible-playbook build/image.yml --syntax-check
          uv run --locked ansible-playbook tests/vm.yml --syntax-check
      - name: Verify release integrity and failure behavior
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .work
          uv run --locked python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee .work/validation.log
      - name: Retain validation results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: configuration-validation
          path: .work/validation.log
          if-no-files-found: ignore
          retention-days: 14
