name: Check package templates

'on':
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 1'

permissions:
  contents: read

jobs:
  templates:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
      - name: Compare the declared package templates
        run: uv run --locked python scripts/check-sources.py locks/builds.yml .work/source-check --project .
      - name: Retain the update proposal
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-update-proposal
          path: |
            .work/source-check/source-changes.json
            .work/source-check/builds.yml
          if-no-files-found: error
