- name: Verify the actual installed configuration
  hosts: wdc
  gather_facts: false
  vars:
    package_lock: "{{ lookup('file', '../../../locks/packages.json') | from_json }}"
    previous_package: "{{ lookup('file', 'previous-package.json') | from_json }}"
  tasks:
    - name: Check native dependencies, alternatives and package database structure
      ansible.builtin.command: xbps-pkgdb -a --checks dependencies,alternatives,pkgdb
      changed_when: false

    - name: Read all installed package versions
      ansible.builtin.command: xbps-query -l
      register: installed_packages
      changed_when: false

    - name: Require every installed package to belong to the locked baseline
      ansible.builtin.assert:
        that:
          - installed_packages.stdout | regex_findall('(?m)^ii ([^ ]+) ') | difference(package_lock.packages.values() | map(attribute='version') | list) | length == 0

    - name: Require explicit kernel selection instead of stock metapackages
      ansible.builtin.assert:
        that:
          - installed_packages.stdout | regex_search('(?m)^ii linux(?:-headers)?-[0-9]') is none
        fail_msg: Stock kernel metapackages must not reintroduce their own kernel series.

    - name: Verify representative exact package versions
      ansible.builtin.command: "xbps-query -p pkgver {{ item }}"
      register: versions
      changed_when: false
      loop: [xbps, python3, tmux, docker, docker-cli, cosmic, "{{ package_lock.kernel_package }}", "{{ package_lock.kernel_package }}-headers", nvidia-open-dkms, nvidia-container-toolkit]

    - name: Compare installed versions with the declared baseline
      ansible.builtin.assert:
        that: item.stdout == package_lock.packages[item.item].version
      loop: "{{ versions.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Read Docker CLI's native installation mode
      ansible.builtin.command: xbps-query -p automatic-install docker-cli
      register: docker_cli_mode
      changed_when: false

    - name: Require the repaired dependency to remain automatic
      ansible.builtin.assert:
        that: docker_cli_mode.stdout == 'yes'

    - name: Verify NVIDIA build and boot artifacts
      ansible.builtin.include_tasks: ../../../build/verify-nvidia.yml

    - name: Validate Docker's actual configuration
      ansible.builtin.command: dockerd --validate --config-file=/etc/docker/daemon.json
      changed_when: false

    - name: Validate the dracut drop-in with the target shell
      ansible.builtin.command: sh -n /etc/dracut.conf.d/wdc-nvidia.conf
      changed_when: false

    - name: Read the actual NVIDIA modesetting policy
      ansible.builtin.slurp:
        src: /etc/modprobe.d/wdc-nvidia.conf
      register: nvidia_policy

    - name: Require the modesetting policy after installation or drift repair
      ansible.builtin.assert:
        that:
          - "'blacklist nouveau' in (nvidia_policy.content | b64decode).splitlines()"
          - "'options nouveau modeset=0' in (nvidia_policy.content | b64decode).splitlines()"
          - "'install nouveau /bin/false' in (nvidia_policy.content | b64decode).splitlines()"
          - "'options nvidia_drm modeset=1' in (nvidia_policy.content | b64decode).splitlines()"

    - name: Read the generated resolver output
      ansible.builtin.slurp:
        src: /etc/resolv.conf
      register: resolver

    - name: Check that openresolv produced the declared server order
      ansible.builtin.assert:
        that:
          - "'# Generated by resolvconf' in (resolver.content | b64decode)"
          - resolver.content | b64decode | regex_findall('(?m)^nameserver (.+)$') == ['1.1.1.1', '8.8.8.8']

    - name: Inspect configuration permissions and enabled services
      ansible.builtin.stat:
        path: "{{ item }}"
      register: paths
      loop:
        - /etc/resolvconf.conf
        - /etc/runit/runsvdir/default/dhcpcd
        - /etc/runit/runsvdir/default/pulseaudio
        - /etc/pipewire/pipewire.conf.d/10-wireplumber.conf
        - /etc/runit/runsvdir/default/docker

    - name: Verify policy permissions and native service selection
      ansible.builtin.assert:
        that:
          - configuration_paths['/etc/resolvconf.conf'].mode == '0644'
          - configuration_paths['/etc/runit/runsvdir/default/dhcpcd'].lnk_source == '/etc/sv/dhcpcd'
          - not configuration_paths['/etc/runit/runsvdir/default/pulseaudio'].exists
          - configuration_paths['/etc/pipewire/pipewire.conf.d/10-wireplumber.conf'].lnk_source == '/usr/share/examples/wireplumber/10-wireplumber.conf'
          - configuration_paths['/etc/runit/runsvdir/default/docker'].lnk_source == '/etc/sv/docker'
      vars:
        configuration_paths: "{{ paths.results | items2dict(key_name='item', value_name='stat') }}"

    - name: Request an unavailable exact version from the current snapshot
      ansible.builtin.command:
        argv: [xbps-install, --ignore-conf-repos, --repository, /opt/wdc-packages, -fy, "{{ previous_package.tmux.version }}"]
      register: unavailable_version
      changed_when: false
      failed_when: false

    - name: Require a missing pin to fail
      ansible.builtin.assert:
        that: unavailable_version.rc != 0

    - name: Verify that the failed request did not substitute another version
      ansible.builtin.command: xbps-query -p pkgver tmux
      register: unchanged_tmux
      changed_when: false

    - name: Require the declared tmux version after the failed request
      ansible.builtin.assert:
        that: unchanged_tmux.stdout == package_lock.packages.tmux.version

- import_playbook: verify_inputs.yml
